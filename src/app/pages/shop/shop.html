<!-- Shop page keeps the explorer's colour identity: navy, cream type (K3). -->
<section class="min-h-svh bg-navy px-5 pt-32 pb-24 text-cream md:px-8 md:pt-40">
  <h1
    class="font-display uppercase"
    [style.font-size]="'var(--text-section)'"
    [style.line-height]="'var(--text-section--line-height)'"
  >
    {{ copy.heading[0] }}<br />
    <span class="italic">{{ copy.heading[1] }}</span>
  </h1>

  <p class="mt-6 max-w-[46ch] text-lg leading-relaxed opacity-80">{{ copy.body }}</p>

  <!-- Filters are real buttons, not pills (L3) -->
  <div class="mt-12 flex gap-0" role="group" aria-label="Filter the catch">
    @for (filter of filters; track filter.id) {
      <button
        type="button"
        class="hairline px-5 py-3"
        [class.bg-cream]="active() === filter.id"
        [class.text-navy]="active() === filter.id"
        [attr.aria-pressed]="active() === filter.id"
        (click)="setFilter(filter.id)"
        data-cursor="arrow"
      >
        <span class="micro-label">{{ filter.label }}</span>
      </button>
    }
  </div>

  <!-- Deliberately irregular: alternating column spans, no identical cards (L2) -->
  <div class="mt-16 grid gap-x-8 gap-y-20 md:grid-cols-12">
    @for (item of items(); track item.id; let i = $index) {
      <div
        [class.md:col-span-6]="i % 2 === 0"
        [class.md:col-span-5]="i % 2 === 1"
        [class.md:col-start-2]="i % 3 === 2"
      >
        <app-fish-product [fish]="item" [position]="i + 1" (quickAdd)="open($event)" />
      </div>
    }
  </div>
</section>

@if (selected(); as item) {
  <app-quick-add [item]="item" (closed)="selected.set(null)" />
}
