@if (showPhoto()) {
  <img
    [src]="href()"
    [alt]="alt()"
    [attr.width]="dimensions()"
    [attr.height]="dimensions()"
    [attr.loading]="eager() ? null : 'lazy'"
    [attr.fetchpriority]="eager() ? 'high' : null"
    decoding="async"
    class="h-full w-full object-contain"
  />
} @else {
  <!--
    Brief I4 fallback. Not a grey box: a two-tone editorial silhouette with
    line-drawn scales and fins, tinted per accent so it reads as a deliberate
    design choice while the photograph is still outstanding.
  -->
  <svg
    viewBox="0 0 200 100"
    role="img"
    [attr.aria-label]="alt()"
    preserveAspectRatio="xMidYMid meet"
    class="h-full w-full"
    fill="none"
    stroke-width="1.25"
    vector-effect="non-scaling-stroke"
    stroke-linecap="round"
  >
    @switch (accent()) {
      @case ('peach') {
        <g stroke="var(--color-navy)">
          <path d="M14 50C30 22 78 14 118 30c14 6 24 13 32 20-8 7-18 14-32 20-40 16-88 8-104-20Z" fill="var(--color-peach)" fill-opacity=".22" />
          <path d="M150 50 192 22l-7 28 7 28Z" fill="var(--color-peach)" fill-opacity=".4" />
          <path d="M60 24c18-18 44-18 62 4" fill="var(--color-peach)" fill-opacity=".4" />
          <path d="M62 52 48 72c12-2 24-10 30-18" fill="var(--color-peach)" fill-opacity=".4" />
        </g>
      }
      @case ('coral') {
        <g stroke="var(--color-navy)">
          <path d="M14 50C30 22 78 14 118 30c14 6 24 13 32 20-8 7-18 14-32 20-40 16-88 8-104-20Z" fill="var(--color-coral)" fill-opacity=".18" />
          <path d="M150 50 192 22l-7 28 7 28Z" fill="var(--color-coral)" fill-opacity=".38" />
          <path d="M60 24c18-18 44-18 62 4" fill="var(--color-coral)" fill-opacity=".38" />
          <path d="M62 52 48 72c12-2 24-10 30-18" fill="var(--color-coral)" fill-opacity=".38" />
        </g>
      }
      @case ('ocean') {
        <g stroke="var(--color-navy)">
          <path d="M14 50C30 22 78 14 118 30c14 6 24 13 32 20-8 7-18 14-32 20-40 16-88 8-104-20Z" fill="var(--color-ocean)" fill-opacity=".18" />
          <path d="M150 50 192 22l-7 28 7 28Z" fill="var(--color-ocean)" fill-opacity=".38" />
          <path d="M60 24c18-18 44-18 62 4" fill="var(--color-ocean)" fill-opacity=".38" />
          <path d="M62 52 48 72c12-2 24-10 30-18" fill="var(--color-ocean)" fill-opacity=".38" />
        </g>
      }
      @case ('sand') {
        <g stroke="var(--color-ink)">
          <path d="M14 50C30 22 78 14 118 30c14 6 24 13 32 20-8 7-18 14-32 20-40 16-88 8-104-20Z" fill="var(--color-sand)" fill-opacity=".26" />
          <path d="M150 50 192 22l-7 28 7 28Z" fill="var(--color-sand)" fill-opacity=".44" />
          <path d="M60 24c18-18 44-18 62 4" fill="var(--color-sand)" fill-opacity=".44" />
          <path d="M62 52 48 72c12-2 24-10 30-18" fill="var(--color-sand)" fill-opacity=".44" />
        </g>
      }
      @default {
        <g stroke="var(--color-navy)">
          <path d="M14 50C30 22 78 14 118 30c14 6 24 13 32 20-8 7-18 14-32 20-40 16-88 8-104-20Z" fill="var(--color-turquoise)" fill-opacity=".2" />
          <path d="M150 50 192 22l-7 28 7 28Z" fill="var(--color-turquoise)" fill-opacity=".4" />
          <path d="M60 24c18-18 44-18 62 4" fill="var(--color-turquoise)" fill-opacity=".4" />
          <path d="M62 52 48 72c12-2 24-10 30-18" fill="var(--color-turquoise)" fill-opacity=".4" />
        </g>
      }
    }
    <!-- gill line, scales, eye: the line-drawn detail that keeps this from
         reading as a generic shape -->
    <g stroke="currentColor" stroke-opacity=".45">
      <path d="M46 30c-6 12-6 28 0 40" />
      <path d="M70 34c8 10 8 22 0 32M88 32c8 11 8 24 0 35M106 36c7 9 7 19 0 28" />
      <path d="M64 50h70" stroke-opacity=".22" />
    </g>
    <circle cx="34" cy="43" r="3.5" stroke="currentColor" stroke-opacity=".7" />
    <circle cx="34" cy="43" r="1.2" fill="currentColor" stroke="none" />
  </svg>
}
